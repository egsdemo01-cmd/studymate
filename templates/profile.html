{% extends "base.html" %}{% block body %}
<h1>👤 My Profile</h1>
<form method="post" class="card form">
  <label>Name<input name="name" value="{{ p.name or '' }}" required></label>
  <label>Class<input name="class" value="{{ p.class or '' }}"></label>
  <label>School<input name="school" value="{{ p.school or '' }}"></label>
  <label>Roll number<input name="roll" value="{{ p.roll or '' }}"></label>
  <label>Email<input name="email" type="email" value="{{ p.email or '' }}"></label>
  <label>About me<textarea name="about" rows="4">{{ p.about or '' }}</textarea></label>
  <button>Save profile</button>
</form>{% endblock %}
